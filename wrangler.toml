name = "craftai"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages 配置
pages_build_output_dir = ".output/public"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "craftai-db"
database_id = "bb60e6ae-597c-4cd7-a958-46942f5dffec"
migrations_dir = "server/db/migrations"

# R2 存储桶绑定
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "craftai-storage"

# KV 命名空间（限流/缓存）
[[kv_namespaces]]
binding = "CACHE"
id = "910cd6d2350548e2a662098ca1e910ba"

# 环境变量（非敏感）
[vars]
NUXT_PUBLIC_APP_NAME = "Creator"
MINIMAX_BASE_URL = "https://api.minimaxi.com"
